<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#121212" />
    <title>kolorkei</title>
    <script>
      // Browsers create AudioContexts suspended until a user gesture. Bevy's audio
      // backend creates its context at startup, so capture every context and resume
      // them on the first key press / tap.
      (() => {
        const contexts = [];
        for (const name of ["AudioContext", "webkitAudioContext"]) {
          const Original = window[name];
          if (!Original) continue;
          const Patched = function (...args) {
            const ctx = new Original(...args);
            contexts.push(ctx);
            return ctx;
          };
          Patched.prototype = Original.prototype;
          window[name] = Patched;
        }
        const unlock = () => {
          for (const ctx of contexts) if (ctx.state === "suspended") ctx.resume();
          const hint = document.getElementById("hint");
          if (hint) hint.style.opacity = "0";
        };
        for (const ev of ["keydown", "pointerdown", "touchstart"]) {
          window.addEventListener(ev, unlock, { passive: true });
        }
        window.addEventListener("contextmenu", (e) => e.preventDefault());
      })();
    </script>
    <link data-trunk rel="rust" data-bin="kolorkei" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #121212; overflow: hidden;
        position: fixed; inset: 0; width: 100%;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas { display: block; width: 100vw !important; height: 100vh !important; outline: none; touch-action: none; }
      #hint {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 90vw; color: #ddd; font: 18px/1.6 system-ui, sans-serif; text-align: center;
        pointer-events: none; transition: opacity 0.6s; user-select: none;
      }
      #hint b { font-size: 40px; letter-spacing: 0.1em; }
    </style>
  </head>
  <body>
    <div id="hint"><b>kolorkei</b><br /><small>tap anywhere or press any key<br />two fingers, right click, Space or Enter clear half</small></div>
  </body>
</html>
