[package]
name = "kolorkei"
version = "0.1.0"
edition = "2021"
description = "Press keys: random colors, shapes and sounds."
license = "MIT"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "default_app",
  "std",
  "multi_threaded",
  "bevy_winit",
  "x11",
  "wayland",
  "webgl2",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_sprite_render",
  "bevy_audio",
  "wav",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
